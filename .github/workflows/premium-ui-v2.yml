name: Build Jam Jawi V6 Selected UI APK
on:
  push:
    branches: [premium-test]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: unzip -q JawiClock.zip
      - name: Apply premium features
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("JawiClock/app/src/main")
          pkg=root/"java/com/example/jawiclock"
          def edit(path,old,new):
              s=path.read_text()
              if old not in s: raise RuntimeError(f"Expected code missing: {path}: {old[:75]}")
              path.write_text(s.replace(old,new,1))
          p=pkg/"Prefs.kt"
          edit(p,'    val zone: String = "",','    val showCountdown: Boolean = true,\n    val dimPast: Boolean = true,\n    val zone: String = "",')
          edit(p,'            zone = p.getString("zone_$id",','            showCountdown = p.getBoolean("countdown_$id", d.showCountdown),\n            dimPast = p.getBoolean("dimPast_$id", d.dimPast),\n            zone = p.getString("zone_$id",')
          edit(p,'            .putString("zone_$id",','            .putBoolean("countdown_$id", s.showCountdown)\n            .putBoolean("dimPast_$id", s.dimPast)\n            .putString("zone_$id",')
          p=pkg/"ConfigActivity.kt"
          block='''        controls.addView(label("Tema premium (preset warna)"))
          val themes = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
          listOf("Original", "Black Gold", "Emerald", "AMOLED").forEach { name ->
              themes.addView(Button(this).apply {
                  text = name
                  textSize = 11f
                  setOnClickListener {
                      style = when (name) {
                          "Original" -> style.copy(clock = Color.YELLOW, accent = Color.GREEN, next = Color.YELLOW, bg = Color.BLACK, bgAlpha = 100, bgImage = false)\n                          "Black Gold" -> style.copy(clock = Color.parseColor("#E8C675"), accent = Color.parseColor("#D7B66A"), next = Color.parseColor("#F4D68D"), bg = Color.BLACK, bgAlpha = 100, bgImage = false)
                          "Emerald" -> style.copy(clock = Color.parseColor("#E9D38A"), accent = Color.parseColor("#8CC9A8"), next = Color.parseColor("#48E09A"), bg = Color.parseColor("#081B16"), bgAlpha = 100, bgImage = false)
                          else -> style.copy(clock = Color.WHITE, accent = Color.parseColor("#D4AF67"), next = Color.parseColor("#7EE0B1"), bg = Color.BLACK, bgAlpha = 100, bgImage = false)
                      }
                      refresh()
                  }
              }, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
          }
          controls.addView(themes)
          controls.addView(CheckBox(this).apply {
              text = "Countdown waktu solat seterusnya"
              setTextColor(Color.WHITE)
              isChecked = style.showCountdown
              setOnCheckedChangeListener { _, checked -> style = style.copy(showCountdown = checked); refresh() }
          })
          controls.addView(CheckBox(this).apply {
              text = "Malapkan waktu solat yang sudah berlalu"
              setTextColor(Color.WHITE)
              isChecked = style.dimPast
              setOnCheckedChangeListener { _, checked -> style = style.copy(dimPast = checked); refresh() }
          })
          '''
          edit(p,'        controls.addView(label("Warna jam besar"))',block+'\n        controls.addView(label("Warna jam besar"))')
          p=pkg/"JawiWidget.kt"
          edit(p,'            rv.setTextViewTextSize(R.id.stdtime, TypedValue.COMPLEX_UNIT_SP, 14f * k)','            rv.setTextViewTextSize(R.id.stdtime, TypedValue.COMPLEX_UNIT_SP, 14f * k)\n            rv.setTextViewTextSize(R.id.countdown, TypedValue.COMPLEX_UNIT_SP, 11f * k)')
          edit(p,'                rv.setViewVisibility(R.id.loc, View.GONE)','                rv.setViewVisibility(R.id.loc, View.GONE)\n                rv.setViewVisibility(R.id.countdown, View.GONE)')
          countdown='''                if (mins != null && st.showCountdown) {
                      val target = if (next == 0 && mins[0] <= nowMin) mins[0] + 1440 else mins[next]
                      val remaining = (target - nowMin).coerceAtLeast(0)
                      val names = arrayOf("Subuh", "Zohor", "Asar", "Maghrib", "Isyak")
                      rv.setTextViewText(R.id.countdown, "${names[next]} dalam ${remaining / 60}j ${remaining % 60}m")
                      rv.setTextColor(R.id.countdown, st.accent)
                      rv.setViewVisibility(R.id.countdown, View.VISIBLE)
                  } else {
                      rv.setViewVisibility(R.id.countdown, View.GONE)
                  }
          '''
          edit(p,'                val next = if (mins == null) -1 else mins.indexOfFirst { it > nowMin }.let { if (it < 0) 0 else it }','                val next = if (mins == null) -1 else mins.indexOfFirst { it > nowMin }.let { if (it < 0) 0 else it }\n'+countdown)
          edit(p,'if (i == next) st.next else st.accent','if (i == next) st.next else if (st.dimPast && mins != null && mins[i] <= nowMin) 0xFF777777.toInt() else st.accent')
          edit(p,'if (i == next) st.next else st.text','if (i == next) st.next else if (st.dimPast && mins != null && mins[i] <= nowMin) 0xFF888888.toInt() else st.text')
          p=root/"res/layout/widget_jawi.xml"
          xml='''        <TextView
              android:id="@+id/countdown"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:gravity="center"
              android:layout_marginTop="3dp"
              android:includeFontPadding="false"
              android:fontFamily="sans-serif-medium"
              android:textColor="#E6C86E"
              android:textSize="12sp"
              android:visibility="gone" />

          '''
          edit(p,'        <TextView\n            android:id="@+id/loc"',xml+'        <TextView\n            android:id="@+id/loc"')
          print("Premium patches applied")
          # Premium UI V2: elegant clock glow and countdown pill
          layout = root/"res/layout/widget_jawi.xml"
          xmlv2 = layout.read_text()
          xmlv2 = xmlv2.replace('android:shadowRadius="16"', 'android:shadowRadius="7"')
          xmlv2 = xmlv2.replace('android:shadowColor="#99FFD600"', 'android:shadowColor="#55D8B35A"')
          target = 'android:id="@+id/countdown"'
          if target not in xmlv2: raise RuntimeError("Countdown view missing")
          start = xmlv2.index('<TextView', xmlv2.index(target)-50) if '<TextView' in xmlv2[xmlv2.index(target)-50:xmlv2.index(target)] else xmlv2.rfind('<TextView',0,xmlv2.index(target))
          end = xmlv2.index('/>',xmlv2.index(target))+2
          original = xmlv2[start:end]
          modified = original.replace('android:layout_width="match_parent"', 'android:layout_width="wrap_content"').replace('android:gravity="center"', 'android:gravity="center"\n              android:layout_gravity="center_horizontal"\n              android:paddingStart="16dp"\n              android:paddingEnd="16dp"\n              android:paddingTop="6dp"\n              android:paddingBottom="6dp"\n              android:background="@drawable/countdown_pill_v2"')
          xmlv2 = xmlv2[:start]+modified+xmlv2[end:]
          layout.write_text(xmlv2)
          (root/"res/drawable/countdown_pill_v2.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#D0101915"/>
              <stroke android:width="1dp" android:color="#A08C7549"/>
              <corners android:radius="24dp"/>
          </shape>""")
          print("Premium UI V2 applied")
          # Design B: optional moon + period label, adjustable size, vivid next prayer
          p = pkg/"Prefs.kt"
          edit(p,'    val showCountdown: Boolean = true,','    val showPeriod: Boolean = true,\n    val periodScale: Int = 100,\n    val showCountdown: Boolean = true,')
          edit(p,'            showCountdown = p.getBoolean("countdown_$id",','            showPeriod = p.getBoolean("showPeriod_$id", d.showPeriod),\n            periodScale = p.getInt("periodScale_$id", d.periodScale),\n            showCountdown = p.getBoolean("countdown_$id",')
          edit(p,'            .putBoolean("countdown_$id",','            .putBoolean("showPeriod_$id", s.showPeriod)\n            .putInt("periodScale_$id", s.periodScale)\n            .putBoolean("countdown_$id",')
          p = pkg/"ConfigActivity.kt"
          settings = '''        controls.addView(label("Paparan Malam / Pagi / Petang"))
          controls.addView(CheckBox(this).apply {
              text = "Ikon bulan + perkataan waktu (ON/OFF)"
              setTextColor(Color.WHITE)
              isChecked = style.showPeriod
              setOnCheckedChangeListener { _, enabled ->
                  style = style.copy(showPeriod = enabled)
                  refresh()
              }
          })
          controls.addView(seek("Saiz ikon dan perkataan waktu", 150, style.periodScale, { "${it}%" }) {
              style = style.copy(periodScale = it.coerceAtLeast(50))
          })
          '''
          edit(p,'        controls.addView(label("Tema premium (preset warna)"))',settings+'\n        controls.addView(label("Tema premium (preset warna)"))')
          p = pkg/"JawiWidget.kt"
          edit(p,'            rv.setTextViewText(R.id.period, Jawi.period(now))','            rv.setTextViewText(R.id.period, if (st.showPeriod) {\n                val hour = now.get(Calendar.HOUR_OF_DAY)\n                val moon = if (hour >= 19 || hour < 6) "☾  " else ""\n                moon + Jawi.period(now)\n            } else "")\n            rv.setViewVisibility(R.id.period, if (st.showPeriod) View.VISIBLE else View.GONE)')
          edit(p,'            rv.setTextViewTextSize(R.id.period, TypedValue.COMPLEX_UNIT_SP, 20f * k)','            rv.setTextViewTextSize(R.id.period, TypedValue.COMPLEX_UNIT_SP, 20f * k * st.periodScale / 100f)')
          edit(p,'if (i == next) st.next else if (st.dimPast && mins != null && mins[i] <= nowMin) 0xFF777777.toInt() else st.accent','if (i == next) 0xFFFFFF33.toInt() else if (st.dimPast && mins != null && mins[i] <= nowMin) 0xFF777777.toInt() else st.accent')
          edit(p,'if (i == next) st.next else if (st.dimPast && mins != null && mins[i] <= nowMin) 0xFF888888.toInt() else st.text','if (i == next) 0xFFFFFFFF.toInt() else if (st.dimPast && mins != null && mins[i] <= nowMin) 0xFF888888.toInt() else st.text')
          print("Design B period and vivid prayer highlight applied")
          # V3: prominent moon/sun beside clock without changing vertical layout.
          layout = root/"res/layout/widget_jawi.xml"
          layout_xml = layout.read_text()
          time_start = layout_xml.index('        <TextView\n            android:id="@+id/time"')
          time_end = layout_xml.index('/>',time_start)+2
          time_node = layout_xml[time_start:time_end]
          if time_start < 0: raise RuntimeError("Clock layout not found")
          decorated = '''        <FrameLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content">
          ''' + time_node.replace('android:layout_width="wrap_content"', 'android:layout_width="match_parent"',1) + '''
              <TextView
                  android:id="@+id/sky_icon"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="end|center_vertical"
                  android:layout_marginEnd="6dp"
                  android:text="☾"
                  android:textSize="36sp"
                  android:textColor="#F0D483"
                  android:shadowColor="#88DDBD78"
                  android:shadowRadius="8"
                  android:shadowDx="0"
                  android:shadowDy="0"
                  android:visibility="visible"/>
          </FrameLayout>'''
          layout.write_text(layout_xml[:time_start]+decorated+layout_xml[time_end:])
          p=pkg/"JawiWidget.kt"
          edit(p,'            rv.setTextViewText(R.id.stdtime, SimpleDateFormat(fmt, Locale.US).format(now.time))','            rv.setTextViewText(R.id.stdtime, SimpleDateFormat(fmt, Locale.US).format(now.time))\n            val skyHour = now.get(Calendar.HOUR_OF_DAY)\n            rv.setTextViewText(R.id.sky_icon, if (skyHour >= 19 || skyHour < 6) "☾" else "☀")\n            rv.setViewVisibility(R.id.sky_icon, if (st.showPeriod) View.VISIBLE else View.GONE)')
          edit(p,'            rv.setTextViewTextSize(R.id.period, TypedValue.COMPLEX_UNIT_SP, 20f * k * st.periodScale / 100f)','            rv.setTextViewTextSize(R.id.period, TypedValue.COMPLEX_UNIT_SP, 20f * k * st.periodScale / 100f)\n            rv.setTextViewTextSize(R.id.sky_icon, TypedValue.COMPLEX_UNIT_SP, 34f * k * st.periodScale / 100f)')
          edit(p,'                    rv.setTextColor(TIME_IDS[i], if (i == next) 0xFFFFFFFF.toInt() else if (st.dimPast && mins != null && mins[i] <= nowMin) 0xFF888888.toInt() else st.text)','                    rv.setTextColor(TIME_IDS[i], if (i == next) 0xFFFFFF33.toInt() else if (st.dimPast && mins != null && mins[i] <= nowMin) 0xFF888888.toInt() else st.text)\n                    rv.setInt(NAME_IDS[i], "setBackgroundResource", if (i == next) R.drawable.prayer_highlight_v3 else 0)\n                    rv.setInt(TIME_IDS[i], "setBackgroundResource", if (i == next) R.drawable.prayer_highlight_v3 else 0)')
          (root/"res/drawable/prayer_highlight_v3.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#503B3109"/>
              <stroke android:width="1dp" android:color="#E0E5C057"/>
              <corners android:radius="8dp"/>
          </shape>""")
          print("V3 sun/moon and prayer highlight applied")
          # V3 correction: remove boxes from prayer names/times, emphasize countdown only.
          p = pkg/"JawiWidget.kt"
          code = p.read_text()
          code = code.replace('                    rv.setInt(NAME_IDS[i], "setBackgroundResource", if (i == next) R.drawable.prayer_highlight_v3 else 0)\n', '')
          code = code.replace('                    rv.setInt(TIME_IDS[i], "setBackgroundResource", if (i == next) R.drawable.prayer_highlight_v3 else 0)\n', '')
          # Restore original text colors, but retain next-prayer emphasis in countdown.
          code = code.replace('if (i == next) 0xFFFFFF33.toInt() else', 'if (i == next) st.next else')
          code = code.replace('if (i == next) 0xFFFFFFFF.toInt() else', 'if (i == next) st.next else')
          code = code.replace('rv.setTextColor(R.id.countdown, st.accent)', 'rv.setTextColor(R.id.countdown, 0xFFFFE27B.toInt())')
          # Avoid showing the clipped character at the far right until a real artwork asset is added.
          code = code.replace('rv.setViewVisibility(R.id.sky_icon, if (st.showPeriod) View.VISIBLE else View.GONE)', 'rv.setViewVisibility(R.id.sky_icon, View.GONE)')
          p.write_text(code)
          (root/"res/drawable/countdown_pill_v2.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#EA142019"/>
              <stroke android:width="2dp" android:color="#FFE5BF64"/>
              <corners android:radius="24dp"/>
          </shape>""")
          print("V3 correction: prayer boxes removed; countdown brightened; clipped icon hidden")
          # V4: restore user-selectable next prayer color and real rendered sky artwork.
          p=pkg/"JawiWidget.kt"
          code=p.read_text()
          code=code.replace('if (i == next) 0xFFFFFF33.toInt() else', 'if (i == next) st.next else')
          code=code.replace('if (i == next) 0xFFFFFFFF.toInt() else', 'if (i == next) st.next else')
          code=code.replace('rv.setTextColor(R.id.countdown, 0xFFFFE27B.toInt())','rv.setTextColor(R.id.countdown, st.next)')
          code=code.replace('rv.setTextViewText(R.id.sky_icon, if (skyHour >= 19 || skyHour < 6) "☾" else "☀")','rv.setImageViewResource(R.id.sky_icon, if (skyHour >= 19 || skyHour < 6) R.drawable.moon_cloud_v4 else R.drawable.sun_cloud_v4)')
          code=code.replace('rv.setViewVisibility(R.id.sky_icon, View.GONE)','rv.setViewVisibility(R.id.sky_icon, if (st.showPeriod) View.VISIBLE else View.GONE)')
          code=code.replace('            rv.setTextViewTextSize(R.id.sky_icon, TypedValue.COMPLEX_UNIT_SP, 34f * k * st.periodScale / 100f)','')
          p.write_text(code)
          layout=root/"res/layout/widget_jawi.xml"
          layout_xml=layout.read_text()
          start=layout_xml.rfind('<TextView',0,layout_xml.index('android:id="@+id/sky_icon"'))
          end=layout_xml.index('/>',layout_xml.index('android:id="@+id/sky_icon"'))+2
          img='''<ImageView
                  android:id="@+id/sky_icon"
                  android:layout_width="76dp"
                  android:layout_height="92dp"
                  android:layout_gravity="end|center_vertical"
                  android:layout_marginEnd="1dp"
                  android:scaleType="fitCenter"
                  android:src="@drawable/moon_cloud_v4"
                  android:visibility="visible"/>'''
          if start < 0: raise RuntimeError("Sky view missing")
          layout.write_text(layout_xml[:start]+img+layout_xml[end:])
          print("V4 source changes applied")
          # V5: no small crescent; independent countdown and next-prayer colors.
          p=pkg/"Prefs.kt"
          edit(p,'    val showCountdown: Boolean = true,','    val countdownColor: Int = 0xFFFFE27B.toInt(),\n    val showCountdown: Boolean = true,')
          edit(p,'            showCountdown = p.getBoolean("countdown_$id",','            countdownColor = p.getInt("countdownColor_$id", d.countdownColor),\n            showCountdown = p.getBoolean("countdown_$id",')
          edit(p,'            .putBoolean("countdown_$id",','            .putInt("countdownColor_$id", s.countdownColor)\n            .putBoolean("countdown_$id",')
          p=pkg/"ConfigActivity.kt"
          code=p.read_text()
          code=code.replace('Warna waktu solat seterusnya (hijau)', 'Warna highlight nama DAN jam solat seterusnya')
          marker='        controls.addView(label("Warna latar"))'
          if marker not in code: raise RuntimeError("Color controls insertion point missing")
          code=code.replace(marker,'''        controls.addView(label("Warna teks countdown (asing daripada waktu solat)"))
          controls.addView(swatches(textColors, { style.countdownColor }) { style = style.copy(countdownColor = it); refresh() })
          '''+marker,1)
          p.write_text(code)
          p=pkg/"JawiWidget.kt"
          code=p.read_text()
          code=code.replace('moon + Jawi.period(now)', 'Jawi.period(now)')
          code=code.replace('rv.setTextColor(R.id.countdown, st.next)', 'rv.setTextColor(R.id.countdown, st.countdownColor)')
          # Always use saved next-prayer highlight color on both name and time.
          code=code.replace('if (i == next) 0xFFFFFF33.toInt() else', 'if (i == next) st.next else')
          code=code.replace('if (i == next) 0xFFFFFFFF.toInt() else', 'if (i == next) st.next else')
          p.write_text(code)
          print("V5: removed small moon, independent color controls enabled")
          # V6 final: centered Roman time, location pin, Jawi prayer labels and gold highlight.
          import re
          layout=root/"res/layout/widget_jawi.xml"
          xml=layout.read_text()
          # Center the standard time by hiding its sibling period and expanding its width.
          for viewid in ("period",):
              match=re.search(r'<TextView\\b[^>]*android:id="@\\+id/'+viewid+r'"[^>]*/>',xml,re.S)
              if match:
                  node=match.group(0)
                  xml=xml.replace(node,node.replace('android:visibility="visible"','android:visibility="gone"'))
          match=re.search(r'<TextView\\b[^>]*android:id="@\\+id/stdtime"[^>]*/>',xml,re.S)
          if not match: raise RuntimeError("Standard clock label missing")
          node=match.group(0)
          node=node.replace('android:layout_width="wrap_content"','android:layout_width="match_parent"')
          if 'android:gravity=' in node: node=re.sub(r'android:gravity="[^"]+"','android:gravity="center"',node)
          else: node=node.replace('android:id="@+id/stdtime"','android:id="@+id/stdtime" android:gravity="center"')
          xml=xml[:match.start()]+node+xml[match.end():]
          layout.write_text(xml)
          p=pkg/"JawiWidget.kt"
          code=p.read_text()
          code=code.replace('rv.setViewVisibility(R.id.period, if (st.showPeriod) View.VISIBLE else View.GONE)','rv.setViewVisibility(R.id.period, View.GONE)')
          code=code.replace('rv.setViewVisibility(R.id.sky_icon, if (st.showPeriod) View.VISIBLE else View.GONE)','rv.setViewVisibility(R.id.sky_icon, View.VISIBLE)')
          # Prefix location with a pin without hardcoding the city name.
          code=re.sub(r'(rv\\.setTextViewText\\(R\\.id\\.loc,\\s*)([^\\n]+)(\\))',r'\\1"📍 " + (\\2)\\3',code,count=1)
          # Apply gold two-layer pill to next Jawi prayer name only.
          lines=code.splitlines()
          for i,line in enumerate(lines):
              if 'rv.setTextColor(NAME_IDS[i]' in line:
                  lines.insert(i+1,'                    rv.setInt(NAME_IDS[i], "setBackgroundResource", if (i == next) R.drawable.prayer_gold_v6 else R.drawable.prayer_normal_v6)')
                  break
          else: raise RuntimeError("Prayer name coloring not found")
          p.write_text('\\n'.join(lines)+'\\n')
          (root/"res/drawable/prayer_gold_v6.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#B32A2107"/>
            <stroke android:width="2dp" android:color="#FFFFD34F"/>
            <corners android:radius="20dp"/>
            <padding android:left="3dp" android:right="3dp" android:top="2dp" android:bottom="2dp"/>
          </shape>""")
          (root/"res/drawable/prayer_normal_v6.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#330B2416"/>
            <stroke android:width="1dp" android:color="#775B963A"/>
            <corners android:radius="20dp"/>
          </shape>""")
          print("V6 final layout applied")
          PY
      - name: Render moon and sun artwork
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFilter
          import math,random
          random.seed(17)
          dest="JawiClock/app/src/main/res/drawable-nodpi"
          from pathlib import Path
          Path(dest).mkdir(parents=True,exist_ok=True)
          for night,name in [(True,"moon_cloud_v4.png"),(False,"sun_cloud_v4.png")]:
              w,h=320,360
              im=Image.new("RGBA",(w,h),(0,0,0,0))
              glow=Image.new("RGBA",(w,h),(0,0,0,0))
              d=ImageDraw.Draw(glow)
              for rad in range(130,36,-2):
                  a=int(14*(130-rad)/94)
                  d.ellipse((155-rad,150-rad,155+rad,150+rad),fill=((80,155,240,a) if night else (255,188,60,a)))
              im=Image.alpha_composite(im,glow.filter(ImageFilter.GaussianBlur(12)))
              body=Image.new("RGBA",(w,h),(0,0,0,0));b=ImageDraw.Draw(body)
              if night:
                  b.ellipse((75,45,245,215),fill=(221,230,237,255))
                  for i in range(105):
                      x=random.randint(92,226);y=random.randint(60,203);r=random.randint(2,10)
                      if (x-160)**2+(y-130)**2<73**2:
                          b.ellipse((x-r,y-r,x+r,y+r),fill=(150,163,177,random.randint(35,100)))
                  cut=Image.new("L",(w,h),0);cd=ImageDraw.Draw(cut)
                  cd.ellipse((115,24,281,192),fill=255)
                  alpha=body.getchannel("A")
                  import PIL.ImageChops
                  alpha=PIL.ImageChops.subtract(alpha,cut)
                  body.putalpha(alpha)
              else:
                  b.ellipse((75,45,245,215),fill=(255,215,95,255))
                  for rad in range(90,30,-10):
                      b.ellipse((160-rad,130-rad,160+rad,130+rad),outline=(255,241,160,120),width=3)
              im=Image.alpha_composite(im,body)
              clouds=Image.new("RGBA",(w,h),(0,0,0,0));c=ImageDraw.Draw(clouds)
              for x,y,rx,ry in [(100,220,90,27),(178,231,102,34),(248,216,78,24),(48,242,67,23)]:
                  c.ellipse((x-rx,y-ry,x+rx,y+ry),fill=(35,75,112,145) if night else (240,221,190,170))
              clouds=clouds.filter(ImageFilter.GaussianBlur(13))
              im=Image.alpha_composite(im,clouds)
              im.save(f"{dest}/{name}",optimize=True)
          print("Rendered moon and sun artwork")
